name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project around the app
        run: |
          mkdir -p app/www
          cp -r index.html manifest.json sw.js icons fonts app/www/
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/status-bar@6 @capacitor/haptics@6 @capacitor/app@6 @capacitor/local-notifications@6
          npx cap init "Cheshbon HaNefesh" com.yankyweber.cheshbon --web-dir www
          npx cap add android
          npx cap sync android

      - name: App icon and splash screen
        run: |
          pip install pillow
          python build/icons.py

      - name: Notification permission
        run: |
          M=app/android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          grep -n "uses-permission" $M

      - name: Version and signing key
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/android/app/build.gradle
          mkdir -p ~/.android
          cp build/app.keystore ~/.android/debug.keystore

      - name: Build
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Cheshbon.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cheshbon HaNefesh 1.${{ github.run_number }}
          body: Download Cheshbon.apk below and open it on your phone to install or update.
          files: Cheshbon.apk
          make_latest: true
